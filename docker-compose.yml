services:
  postgres:
    image: postgres:16-alpine
    container_name: pgt-postgres
    environment:
      POSTGRES_USER: pgt
      POSTGRES_PASSWORD: pgt
      POSTGRES_DB: pgt
    ports:
      # 5432 = host Postgres, 5433 = vectorify. PGT uses 5434.
      - "5434:5432"
    volumes:
      - pgt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgt -d pgt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgt_pgdata:
